ymbol id="i-chevron" viewBox="0 0 24 24" data-page-node-id="uE46KMsK6U3dizDVbi81x8"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="ELNv4yUVx00BQWeS0EbCMA"/></symbol><symbol id="i-back" viewBox="0 0 24 24" data-page-node-id="zjS1z85CtYfAU66ZqRfrFi"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="nsvmgZ68xEqqp5R4CvXzEU"/></symbol><symbol id="i-cup" viewBox="0 0 32 32" data-page-node-id="lxzIKzoXUEE22VtWGC3bdH"><path d="M6 8h17v12c0 5-3 8-8 8s-9-3-9-8V8Zm17 3h3a4 4 0 0 1 0 8h-3M4 28h23" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="qaQdOzvK8ZW2qsgaPE3CfT"/></symbol><symbol id="i-camera" viewBox="0 0 32 32" data-page-node-id="bhjolmdkyr7BvZXTFMfxcl"><path d="M5 10h6l2-3h6l2 3h6v17H5V10Z" fill="none" stroke="currentColor" stroke-linejoin="round" data-page-node-id="ZbGI6GUrs9OEvXEHykpDSF"/><circle cx="16" cy="18" r="5" fill="none" stroke="currentColor" data-page-node-id="rUkEo7IL1q99XqpfwEAL7m"/></symbol><symbol id="i-spark" viewBox="0 0 32 32" data-page-node-id="dxODemIHw67QjqCGLhdbGT"><path d="m16 2 3.4 10.6L30 16l-10.6 3.4L16 30l-3.4-10.6L2 16l10.6-3.4L16 2Z" fill="none" stroke="currentColor" stroke-linejoin="round" data-page-node-id="2s9PCmMBgBFqCFXt7EdpmG"/></symbol><symbol id="i-trend" viewBox="0 0 32 32" data-page-node-id="kqajV35XPTCE23KT9qbv1y"><path d="M4 26V6M4 26h24M8 20l7-8 5 4 7-9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="MzDDfQjbLYLO1xy7mIbBSB"/></symbol><symbol id="i-pen" viewBox="0 0 32 32" data-page-node-id="qf2b8oVGZgbl3iy2EeF5VR"><path d="m6 25 5-.8L27 8l-4-4L7 20l-1 5ZM20 7l4 4" fill="none" stroke="currentColor" stroke-linejoin="round" data-page-node-id="sXPkb6hPIh3FmHUzNXhsNG"/></symbol></svg>
<script>
(() => {
  const STORE = 'beanfolio-personal-v2';
  const methods = ['手冲','意式','摩卡壶','法压壶','爱乐压','其他'];
  const axes = ['酸度','甜感','苦感','醇厚','香气','余韵'];
  const $ = (s, root=document) => root.querySelector(s);
  const icon = (id, cls='') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"></use></svg>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const pad = n => String(n).padStart(2,'0');
  const dateKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseDay = key => {const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
  const shift = (key, n) => {const d=parseDay(key);d.setDate(d.getDate()+n);return dateKey(d)};
  const daysBetween = (a,b) => Math.round((parseDay(b)-parseDay(a))/86400000);
  const shortDay = key => {const d=parseDay(key);return `${d.getMonth()+1}月${d.getDate()}日`};
  const money = v => v === '' || v == null ? '未记录' : `¥${Number(v).toFixed(2).replace(/\.00$/,'')}`;
  const id = () => `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
  const now = dateKey();
  const starter = () => ({beans:[],tools:[],brews:[]});
  function load(){try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&Array.isArray(v.beans)&&Array.isArray(v.tools)&&Array.isArray(v.brews))return v}catch(e){}return starter()}
  let db=load();
  const state={tab:'beans',filter:'全部',method:'全部',calendarType:'beans',month:new Date().getMonth(),year:new Date().getFullYear(),selected:now,modal:null,pendingPhoto:''};
  const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){toast('本机存储空间不足，请使用更小的图片')}};
  const beanBy = n => db.beans.find(b=>b.id===n);
  const toolBy = n => db.tools.find(t=>t.id===n);
  const brewsFor = n => db.brews.filter(b=>b.beanId===n);
  const used = bean => Math.round(brewsFor(bean.id).reduce((n,b)=>n+Number(b.dose),0)*10)/10;
  const remaining = bean => Math.round((Number(bean.grams)-used(bean))*10)/10;
  const plannedDose = bean => Number(bean?.expectedDose)>0?Number(bean.expectedDose):15;
  const servings = bean => Math.max(0,Math.floor((remaining(bean)+0.00001)/plannedDose(bean)));
  const drinkingStart = bean => bean.startDate||brewsFor(bean.id).map(b=>b.date).sort()[0]||'';
  function beanStatus(bean){if(bean.finished||remaining(bean)<=0)return {key:'done',label:'已喝完'};if(!bean.roast)return {key:'cool',label:'待补烘焙日'};const d=daysBetween(bean.roast,now);if(d<Number(bean.tasteStart))return {key:'rest',label:`养豆中 剩${Number(bean.tasteStart)-d}天`};if(d<=Number(bean.tasteEnd))return {key:'best',label:'最佳赏味期'};return {key:'fade',label:'风味衰退期'}}
  function visual(bean,large=false){let inner=bean.photo?`<img class="bag-photo" src="${esc(bean.photo)}" alt="${esc(bean.name)}的包装图">`:`<div class="bag bag-${esc(bean.color||'custom')}"><small>${esc((bean.brand||'BEAN').slice(0,13))}</small><div class="bag-label">${esc(bean.origin||'COFFEE')}<br>•<br>${esc(bean.process||'ROASTED')}</div><span class="bag-name">${esc(bean.name.slice(0,15))}</span></div>`;return `<div class="bean-visual ${large?'large':''}"><div class="bean-orb"></div>${inner}</div>`}
  function header(title,subtitle,art,eyebrow='BEANFOLIO · 你的咖啡日常'){return `<div class="statusbar"><span>${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><span class="signal"><svg viewBox="0 0 22 18" fill="currentColor"><path d="M1 13h3v4H1zm5-4h3v8H6zm5-4h3v12h-3zm5-4h3v16h-3z"/></svg><svg viewBox="0 0 21 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5c5-5 12-5 17 0M5 9c3-3 8-3 11 0m-7 4c1-1 2-1 3 0"/></svg><svg viewBox="0 0 24 16"><rect x="1" y="2" width="20" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="4" width="16" height="8" rx="1" fill="currentColor"/><path d="M22 5v6" stroke="currentColor" stroke-width="2"/></svg></span></div><header class="page-header"><div class="eyebrow"><span class="dot"></span>${eyebrow}</div><div class="headline-row"><div><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="header-art">${icon(art)}</div></div></header>`}
  function dock(){const tabs=[['beans','bean','豆仓'],['brew','brew','冲煮'],['tools','tools','器具'],['calendar','calendar','日历']];$('#dock').innerHTML=`<nav class="bottom-dock" aria-label="底部导航"><div class="nav-pill">${tabs.map(t=>`<button class="nav-item ${state.tab===t[0]?'active':''}" data-tab="${t[0]}" aria-label="${t[2]}" aria-current="${state.tab===t[0]?'page':'false'}">${icon(t[1])}<span>${t[2]}</span></button>`).join('')}</div><button class="fab" data-action="actions" aria-label="新增记录">${icon('plus')}</button></nav>`}
  function beanCard(bean){const status=beanStatus(bean), rem=remaining(bean),pct=Math.max(0,Math.min(100,rem/bean.grams*100));return `<button class="bean-card" data-action="bean-detail" data-id="${esc(bean.id)}" aria-label="查看${esc(bean.name)}详情"><span class="badge ${status.key}">${status.label}</span>${visual(bean)}<div class="bean-name">${esc(bean.name)}</div><div class="bean-brand">${esc(bean.brand)}</div><div class="bean-meta">${esc(bean.origin||'未填产地')} · ${esc(bean.process||'未填处理法')}</div><div class="bean-bottom"><b>${rem}g</b><span>/ ${bean.grams}g</span></div><div class="progress-track"><span style="width:${pct}%"></span></div><div class="bean-servings">按 ${plannedDose(bean)}g / 次 · 约可喝 <b>${servings(bean)} 次</b></div>${drinkingStart(bean)?`<div class="bean-start">${shortDay(drinkingStart(bean))} 开始喝</div>`:''}</button>`}
  function beansPage(){if(!db.beans.length)return header('管理你的咖啡豆','好好保存每一袋，也记住每一次好喝。','bean')+`<div class="summary-strip"><span>我的豆仓 <strong>0 袋</strong></span><i></i><span>从你的第一袋开始</span></div><div class="empty-stage"><div class="empty-art">${icon('bean')}</div><h2>豆仓还空着，等你来装满</h2><p>上传你自己的咖啡豆包装照，记下品牌、<br>价格和烘焙日期，第一张豆卡就属于你。</p><button class="primary" data-action="add-bean">${icon('plus')} 添加第一袋咖啡豆</button><div class="empty-hint">只保存在你当前的手机浏览器中 · 不会作为公开示例展示</div></div><p class="footer-note">每一袋好豆，都值得被认真记住。</p>`;const options=['全部','赏味中','养豆中','已过期','已喝完'];let list=db.beans.filter(b=>{const s=beanStatus(b).key;return state.filter==='全部'||(state.filter==='赏味中'&&s==='best')||(state.filter==='养豆中'&&s==='rest')||(state.filter==='已过期'&&s==='fade')||(state.filter==='已喝完'&&s==='done')});const beanSpend=db.beans.reduce((v,b)=>v+(Number(b.price)||0),0);return header('管理你的咖啡豆','好好保存每一袋，也记住每一次好喝。','bean')+`<div class="summary-strip"><span>我的豆仓 <strong>${db.beans.length} 袋</strong></span><i></i><span>剩余 <strong>${db.beans.reduce((v,b)=>v+remaining(b),0).toFixed(1).replace(/\.0$/,'')}g</strong></span><i></i><span>购豆 <strong>¥${Math.round(beanSpend)}</strong></span></div><div class="section-head"><h2>正在收藏的味道</h2><span>${list.length} 袋豆子</span></div><div class="chips">${options.map(o=>`<button class="chip ${state.filter===o?'active':''}" data-action="bean-filter" data-value="${o}">${o}</button>`).join('')}</div>${list.length?`<div class="bean-grid">${list.map(beanCard).join('')}</div>`:`<div class="blank">这里还没有豆子。<br>试试右下角的加号，存下你的第一袋。</div>`}<p class="footer-note">每一袋好豆，都值得被认真记住。</p>`}
  function recentCard(brew){const bean=beanBy(brew.beanId);return `<button class="recent-card" data-action="brew-detail" data-id="${brew.id}">${visual(bean||{name:'已删除的豆子',brand:'COFFEE'})}<div class="recent-copy"><strong>${esc(brew.method)} · ${esc(bean?.name||'已删除的豆子')}</strong><span>${brew.dose}g 豆　${brew.water?`1 : ${Math.round(brew.water/brew.dose)}`:''}　${brew.temp||'--'}°C</span></div><div class="date-mini">${shortDay(brew.date)}</div></button>`}
  function brewPage(){if(!db.beans.length)return header('冲煮日记','喝完一杯，随心记一杯。','brew')+`<div class="empty-stage"><div class="empty-art">${icon('brew')}</div><h2>从第一袋豆子开始</h2><p>先收下一袋咖啡豆，之后就能用手机<br>记录每一杯的配方、用豆量和风味。</p><button class="primary" data-action="add-bean">添加咖啡豆</button></div><p class="footer-note">风味会忘记，记录不会。</p>`;const cups=db.brews.length,total=db.brews.reduce((n,b)=>n+Number(b.dose),0), sorted=[...db.brews].sort((a,b)=>b.date.localeCompare(a.date));const bean=db.beans.find(b=>!b.finished&&remaining(b)>0);return header('冲煮日记','喝完一杯，随心记一杯。','brew')+`<div class="quick-stats"><div class="stat-tile"><small>累计冲煮</small><b>${cups}<em> 杯</em></b></div><div class="stat-tile"><small>喝掉的豆子</small><b>${total.toFixed(1).replace(/\.0$/,'')}<em> g</em></b></div></div><div class="section-head"><h2>最近冲煮</h2><button data-action="open-brew">记一杯 ${icon('plus')}</button></div>${sorted.length?sorted.map(recentCard).join(''):`<div class="blank">还没有记录，今天来冲一杯吧。</div>`}<div class="section-head"><h2>下一杯喝什么？</h2><span>一点点灵感</span></div>${bean?`<button class="feature-card" style="width:100%;border:0;text-align:left" data-action="open-brew" data-id="${bean.id}">${visual(bean)}<div><h3>${esc(bean.name)}</h3><p>${beanStatus(bean).label} · 还剩 ${remaining(bean)}g</p></div>${icon('chevron','feature-arrow')}</button>`:''}<p class="footer-note">风味会忘记，记录不会。</p>`}
  function toolGraphic(kind){let body='';if(kind==='手冲')body='<path d="M20 10h60l-10 26H30L20 10Zm12 30h36M38 40v13m24-13v13M32 53h37l-5 33H38l-6-33ZM36 86h31M30 93h46"/><path d="M70 59c18-6 23 20 1 20"/>';else if(kind==='意式')body='<rect x="19" y="14" width="63" height="47" rx="9"/><path d="M25 29h50M30 61h41M37 69h29M40 68v16m25-16v16M32 87h48M57 43h25m-20 3v14"/><circle cx="50" cy="23" r="5"/>';else if(kind==='摩卡壶')body='<path d="M37 12h26l-5 13H42L37 12ZM29 27h42l-6 31H35L29 27Zm8 31h26l8 29H29l8-29ZM29 87h42M70 34l17 2-9 32-11-3M29 37l-10-2 12 15"/>';else if(kind==='爱乐压')body='<path d="M39 10h22v15H39zM36 25h28v50H36zM27 76h46M33 81h34v10H33zM45 36h10v28H45"/>';else if(kind==='法压壶')body='<path d="M28 24h43v63H28zM27 42h46M27 76h46M50 8v35M44 8h12M73 37c22-4 22 41 0 36M27 90h46"/>';else body='<path d="M30 10h40v68H30zM23 78h54v9H23zM40 29h20M40 43h20M40 57h20"/>';return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`}
  function toolsPage(){if(!db.tools.length)return header('我的冲煮器具','从磨豆机到滤杯，都是好咖啡的搭档。','tools')+`<div class="empty-stage empty-tools"><div class="empty-art">${toolGraphic('手冲')}</div><h2>器具架，等你的第一件收藏</h2><p>把常用的滤杯、磨豆机或咖啡机加进来，<br>冲煮时就能随手选到它。</p><button class="primary" data-action="add-tool">添加第一件器具</button></div><p class="footer-note">工具不必多，合手就好。</p>`;const groups=['手冲','意式','摩卡壶','法压壶','爱乐压','其他'];let list=db.tools.filter(t=>state.method==='全部'||t.category===state.method);let featured=db.tools.filter(t=>t.category==='手冲').slice(0,4);return header('我的冲煮器具','从磨豆机到滤杯，都是好咖啡的搭档。','tools')+`<div class="section-head"><h2>常用器具</h2><span>${db.tools.length} 件珍藏</span></div><div class="tool-category"><div class="tool-illustration">${toolGraphic('手冲')}</div><div class="tool-list"><strong>手冲</strong><small>慢慢冲，刚刚好</small>${featured.map(t=>`<button data-action="tool-detail" data-id="${t.id}"><span>${esc(t.name)}</span>${icon('chevron')}</button>`).join('')||'<small>还没有手冲器具</small>'}</div></div><div class="section-head"><h2>按方式找器具</h2><span>自由切换</span></div><div class="chips">${['全部',...groups].map(o=>`<button class="chip ${state.method===o?'active':''}" data-action="tool-filter" data-value="${o}">${o}</button>`).join('')}</div>${list.length?`<div class="tool-grid">${list.map(t=>`<button class="tool-card" data-action="tool-detail" data-id="${t.id}"><div class="tool-drawing">${toolGraphic(t.category)}</div><strong>${esc(t.name)}</strong><span>${esc(t.brand||'未填品牌')}</span><em>${esc(t.category)}</em></button>`).join('')}</div>`:`<div class="blank">这里还没有器具。点加号添加一件吧。</div>`}<p class="footer-note">工具不必多，合手就好。</p>`}
  function dayEvents(day){if(state.calendarType==='beans'){const result=[];db.beans.forEach(b=>{if(b.purchase===day)result.push({type:'购入',name:b.name,id:b.id,mark:'purchase'});if(b.roast===day)result.push({type:'烘焙',name:b.name,id:b.id,mark:'roast'});if(drinkingStart(b)===day)result.push({type:'开始喝',name:b.name,id:b.id,mark:'brew'});if(b.roast&&shift(b.roast,Number(b.tasteStart))===day)result.push({type:'赏味开始',name:b.name,id:b.id,mark:'brew'});if(b.roast&&shift(b.roast,Number(b.tasteEnd))===day)result.push({type:'赏味结束',name:b.name,id:b.id,mark:'brew'})});return result}return db.brews.filter(b=>b.date===day).map(b=>({type:b.method,name:beanBy(b.beanId)?.name||'已删除的豆子',dose:b.dose,id:b.id,mark:'brew'}))}
  function calendarPage(){const first=new Date(state.year,state.month,1),offset=(first.getDay()+6)%7,days=new Date(state.year,state.month+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<span></span>';for(let d=1;d<=days;d++){let day=`${state.year}-${pad(state.month+1)}-${pad(d)}`,events=dayEvents(day);cells+=`<button class="day-cell ${day===state.selected?'selected':''} ${day===now?'today':''}" data-action="select-day" data-day="${day}" aria-label="${shortDay(day)}，${events.length}条记录"><span>${d}</span>${events.length?`<span class="event-dots">${events.slice(0,3).map(e=>`<i class="${e.mark}"></i>`).join('')}</span>`:''}</button>`}const events=dayEvents(state.selected);const monthly=state.calendarType==='beans'?db.beans.filter(b=>b.purchase.startsWith(`${state.year}-${pad(state.month+1)}`)).length:db.brews.filter(b=>b.date.startsWith(`${state.year}-${pad(state.month+1)}`)).length;return header('日历里的咖啡','把日子过成一杯杯喜欢的样子。','calendar')+`<div class="calendar-toggle"><button class="${state.calendarType==='beans'?'active':''}" data-action="calendar-type" data-value="beans">咖啡豆日历</button><button class="${state.calendarType==='brews'?'active':''}" data-action="calendar-type" data-value="brews">喝咖啡日历</button></div><div class="calendar-card"><div class="month-controls"><button class="circle-btn" data-action="change-month" data-offset="-1" aria-label="上个月">${icon('back')}</button><strong>${state.year}年 ${pad(state.month+1)}月</strong><button class="circle-btn" data-action="change-month" data-offset="1" aria-label="下个月">${icon('chevron')}</button></div><div class="weekdays">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days-grid">${cells}</div></div><div class="summary-strip" style="margin-top:15px"><span>这个月 · ${state.calendarType==='beans'?'新入库':'喝了'} <strong>${monthly} ${state.calendarType==='beans'?'袋':'杯'}</strong></span><i></i><span>${state.calendarType==='beans'?'黄点购入 · 蓝点烘焙':'绿点代表冲煮记录'}</span></div><div class="day-detai   function render(){const screen=$('#screen');const top=screen.scrollTop;screen.innerHTML=state.tab==='beans'?beansPage():state.tab==='brew'?brewPage():state.tab==='tools'?toolsPage():calendarPage();screen.scrollTop=top;dock();renderModal()}
  const sheet=(title,subtitle,body)=>`<div class="overlay" data-action="dismiss-overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-top"><div class="grabber"></div><h2 class="sheet-heading">${esc(title)}</h2><p class="sheet-subheading">${esc(subtitle)}</p><button class="sheet-close" data-action="close" aria-label="关闭">${icon('x')}</button></div><div class="sheet-body">${body}</div></div></div>`;
  function beanDetail(id){const b=beanBy(id);if(!b)return '';const status=beanStatus(b),age=b.roast?daysBetween(b.roast,now):null,recent=[...brewsFor(b.id)].sort((a,c)=>c.date.localeCompare(a.date));return sheet('咖啡豆详情','每一袋豆子的好日子，都在这里。',`<div class="detail-hero">${visual(b,true)}<span class="detail-label">${esc(status.label)}</span></div><div class="detail-main"><h2>${esc(b.name)}</h2><div class="sub">${esc(b.brand)} · ${esc(b.origin||'未填产地')}</div><div class="mini-stats"><div><span>养豆日数</span><strong>${age===null?'未记录':`第 ${age} 天`}</strong></div><div><span>喝掉 / 剩余</span><strong>${used(b)} / ${remaining(b)}g</strong></div></div><div class="plan-preview">按 ${plannedDose(b)}g / 次，剩余约可喝 <strong>${servings(b)} 次</strong>${remaining(b)>0&&servings(b)===0?'（不足一整杯，可调整用量）':''}</div><div class="notes-tags">${(b.tags||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')||'<span>暂无风味标签</span>'}</div><div class="detail-divider"></div><div class="detail-title">豆子档案</div><div class="detail-grid"><div><span>豆种 / 品种</span><b>${esc(b.variety||'未记录')}</b></div><div><span>烘焙度</span><b>${esc(b.roastLevel||'未记录')}</b></div><div><span>处理方式</span><b>${esc(b.process||'未记录')}</b></div><div><span>烘焙日期</span><b>${b.roast?shortDay(b.roast):'未记录'}</b></div><div><span>购买日期</span><b>${shortDay(b.purchase)}</b></div><div><span>购入渠道</span><b>${esc(b.channel||'未记录')}</b></div><div><span>购入价格</span><b>${money(b.price)}</b></div><div><span>开始喝的日期</span><b>${drinkingStart(b)?shortDay(drinkingStart(b)):'还没开始喝'}</b></div><div><span>预计每次用豆</span><b>${plannedDose(b)} g / 次</b></div><div><span>饮用状态</span><b>${b.finished?'手动标记已喝完':remaining(b)<=0?'豆子已用完':'还在喝'}</b></div><div><span>最佳赏味期</span><b>${b.roast?`${shortDay(shift(b.roast,Number(b.tasteStart)))}—${shortDay(shift(b.roast,Number(b.tasteEnd)))}`:'未设置'}</b></div></div><div class="detail-divider"></div><div class="detail-title">冲煮笔记 · ${recent.length} 杯</div>${recent.length?recent.map(r=>`<button class="event-row" d   function toolDetail(id){const t=toolBy(id);if(!t)return '';return sheet('器具详情','每件心爱的器具，都陪你冲出不同的味道。',`<div class="detail-hero" style="height:220px;display:grid;place-items:center">${toolGraphic(t.category)}</div><div class="detail-main"><h2>${esc(t.name)}</h2><div class="sub">${esc(t.brand||'未填品牌')} · ${esc(t.category)}</div><div class="detail-divider"></div><div class="detail-grid"><div><span>器具类型</span><b>${esc(t.type||'其他')}</b></div><div><span>购入价格</span><b>${money(t.price)}</b></div><div><span>购入日期</span><b>${t.purchase?shortDay(t.purchase):'未记录'}</b></div><div><span>使用次数</span><b>${db.brews.filter(b=>b.toolId===t.id).length} 次</b></div></div><div class="action-row"><button class="secondary" data-action="edit-tool" data-id="${t.id}">编辑器具</button><button class="primary" data-action="open-brew" data-method="${esc(t.category)}">用它记一杯</button></div></div>`)}
  function radar(flavor){const values=flavor.map(Number),cx=150,cy=145,R=88;const point=(axis,r)=>{let a=(axis*60-90)*Math.PI/180;return `${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`};const grid=[1,2,3,4,5].map(level=>`<polygon points="${axes.map((_,i)=>point(i,R*level/5)).join(' ')}" fill="none" stroke="#e5e9db" stroke-width="1"/>`).join('');const lines=axes.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${point(i,R).replace(',','" y2="')}" stroke="#e5e9db" stroke-width="1"/>`).join('');const polygon=axes.map((_,i)=>point(i,R*Math.max(0,Math.min(5,values[i]||0))/5)).join(' ');const labels=axes.map((a,i)=>{const [x,y]=point(i,R+23).split(',');return `<text x="${x}" y="${Number(y)+4}" text-anchor="middle" font-size="11" fill="#74776a">${a}</text>`}).join('');return `<div class="radar-wrap"><svg viewBox="0 0 300 290" role="img" aria-label="风味雷达图，${axes.map((a,i)=>`${a}${values[i]}/5`).join('，')}">${grid}${lines}<polygon points="${polygon}" fill="rgba(173,205,82,.38)" stroke="#93b336" stroke-width="2.5" stroke-linejoin="round"/>${axes.map((_,i)=>{const [x,y]=point(i,R*Math.max(0,Math.min(5,values[i]||0))/5).split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="#8aaa34"/>`}).join('')}${labels}</svg><p class="radar-caption">这是一张属于你的主观风味地图，不是标准杯测评分。</p></div>`}

  function toolForm(id){const t=id?toolBy(id):null;return sheet(t?'编辑器具':'添一件新器具','它会陪你完成很多杯好咖啡。',`<form id="toolForm" data-edit="${t?.id||''}"><div class="field"><label for="toolName">器具名称 *</label><input id="toolName" name="name" required placeholder="如 Origami Air 折纸滤杯" value="${esc(t?.name||'')}"></div><div class="two-col"><div class="field"><label for="toolBrand">品牌</label><input id="toolBrand" name="brand" placeholder="ORIGAMI" value="${esc(t?.brand||'')}"></div><div class="field"><label for="toolType">器具类型</label><input id="toolType" name="type" placeholder="滤杯 / 磨豆机" value="${esc(t?.type||'')}"></div></div><div class="field"><label for="toolCategory">冲煮方式 *</label><select id="toolCategory" name="category" required>${methods.map(m=>`<option ${t?.category===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="two-col"><div class="field"><label for="toolPrice">购入价格 ¥</label><input id="toolPrice" name="price" type="number" min="0" step="0.01" placeholder="未记录" value="${t?.price??''}"></div><div class="field"><label for="toolPurchase">购入日期</label><input id="toolPurchase" name="purchase" type="date" max="${now}" value="${t?.purchase||now}"></div></div><div id="toolError" class="form-error" role="alert"></div><button type="submit" class="primary">${t?'保存修改':'加入器具架'}</button></form>`)}

  async function processPhoto(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('请选择图片文件');if(file.size>10*1024*1024)return toast('图片不能大于 10 MB');const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>{const scale=Math.min(1,820/image.width,820/image.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);state.pendingPhoto=canvas.toDataURL('image/jpeg',.68);const label=$('#photoLabel');if(label)label.innerHTML=`<img src="${state.pendingPhoto}" alt="待保存的包装图片"><input id="beanPhoto" type="file" accept="image/*">`;URL.revokeObjectURL(url)};image.onerror=()=>{URL.revokeObjectURL(url);toast('这张图片无法读取，请换一张')};image.src=url}
  document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.modal=null;$('#screen').scrollTop=0;render();return}const target=e.target.closest('[data-action]');if(!target)return;const a=target.dataset.action;if(a==='dismiss-overlay'){if(e.target===target){state.modal=null;renderModal()}return}const key=target.dataset.id;if(a==='close'){state.modal=null;renderModal()}else if(a==='actions')open('actions');else if(a==='add-bean')open('bean-form');else if(a==='add-tool')open('tool-form');else if(a==='bean-detail')open('bean-detail',{id:key});else if(a==='tool-detail')open('tool-detail',{id:key});else if(a==='brew-detail')open('brew-detail',{id:key});else if(a==='edit-bean')open('bean-form',{id:key});else if(a==='edit-tool')open('tool-form',{id:key});else if(a==='edit-brew')open('brew-form',{editId:key});else if(a==='toggle-finished'){const bean=beanBy(key);if(bean){bean.finished=!bean.finished;persist();render();toast(bean.finished?'已标记喝完，剩余克数保持不变':'已恢复为未喝完')}}else if(a==='open-brew'){if(!db.beans.length)return toast('先添加一袋咖啡豆吧');if(!db.beans.some(b=>!b.finished&&remaining(b)>0))return toast('没有可用豆子，请先取消喝完标记或添加新豆');if(key&&(beanBy(key)?.finished||remaining(beanBy(key))<=0))return toast('这袋豆已喝完，请先取消喝完标记');open('brew-form',{beanId:key,method:target.dataset.method})}else if(a==='bean-filter'){state.filter=target.dataset.value;render()}else if(a==='tool-filter'){state.method=target.dataset.value;render()}else if(a==='calendar-type'){state.calendarType=target.dataset.value;render()}else if(a==='change-month'){let d=new Date(state.year,state.month+Number(target.dataset.offset),1);state.year=d.getFullYear();state.month=d.getMonth();state.selected=dateKey(d);render()}else if(a==='select-day'){state.selected=target.dataset.day;render()}else if(a==='delete-brew'){if(confirm('删除这杯记录？这杯消耗的豆量会自动返还。')){db.brews=db.brews.filter(b=>b.id!==key);persist();state.modal=null;render();toast('记录已删除，豆量已返还')}}});
  document.addEventListener('submit',e=>{if(['beanForm','toolForm','brewForm'].includes(e.target.id)){e.preventDefault();if(e.target.id==='beanForm')saveBean(e.target);if(e.target.id==='toolForm')saveTool(e.target);if(e.target.id==='brewForm')saveBrew(e.target)}});
  document.addEventListener('change',e=>{if(e.target.id==='beanPhoto')processPhoto(e.target.files[0]);if(e.target.id==='brewMethod')syncToolOptions('');if(e.target.id==='brewBean'&&!$('#brewForm')?.dataset.edit){const bean=beanBy(e.target.value);if(bean)$('#brewDose').value=plannedDose(bean)}});
  document.addEventListener('input',e=>{if(e.target.id==='beanGrams'||e.target.id==='beanExpectedDose')updateBeanPlanPreview();if(e.target.classList.contains('flavor-slider')){e.target.nextElementSibling.textContent=e.target.value;$('#liveRadar').innerHTML=radar([...document.querySelectorAll('.flavor-slider')].map(x=>Number(x.value)))}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;renderModal()}});
  window.__beanfolio={getData:()=>JSON.parse(JSON.stringify(db)),getRemaining:(beanId)=>{const bean=beanBy(beanId);return bean?remaining(bean):null},getDayEvents:date=>dayEvents(date),reset:()=>{db=starter();persist();state.modal=null;render()}};
  render();
})();
</script>
